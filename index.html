<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tipněte si výsledek komunálních a senátních voleb 2026 ve své obci a porovnejte se s ostatními." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4fafb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12242a" />
    <!-- The site ships its own dark theme, so Dark Reader should leave it alone. -->
    <meta name="darkreader-lock" />
    <script>
      // Apply the saved or device theme before first paint to avoid a flash of the wrong one.
      try {
        var t = localStorage.getItem("theme");
        var dark = t === "dark" || ((t === "system" || !t) && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      } catch (e) {}
    </script>
    <title>Volební tipovačka 2026</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
